<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Central</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="formLogin" class="cartao">
    <h1>🚗 Painel da Central</h1>
    <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    <button>Entrar</button>
    <p class="erro" id="erroLogin"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <strong id="nomeCentral">Central</strong>
    <nav>
      <button data-aba="corridas" class="ativa">Corridas</button>
      <button data-aba="motoristas">Motoristas</button>
      <button data-aba="relatorio">Relatório</button>
      <button data-aba="config">Configurações</button>
    </nav>
    <button id="sair" class="sec">Sair</button>
  </header>

  <main>
    <section id="aba-corridas">
      <div class="linha">
        <h2>Corridas</h2>
        <label class="inline">Dia <input type="date" id="diaCorridas"></label>
      </div>
      <div class="kpis" id="kpisAgora"></div>
      <div id="listaCorridas"></div>
    </section>

    <section id="aba-motoristas" hidden>
      <div class="linha">
        <h2>Motoristas</h2>
        <button id="novoMotorista">+ Cadastrar motorista</button>
      </div>
      <form id="formMotorista" class="cartao" hidden>
        <input type="hidden" name="id">
        <div class="grade">
          <label>Nome<input name="nome" required></label>
          <label>WhatsApp (com DDD)<input name="telefone" inputmode="tel" required placeholder="67 99999-9999"></label>
          <label>Tipo de veículo<select name="tipo">
            <option value="moto">🏍️ Moto</option><option value="carro">🚗 Carro</option>
            <option value="van">🚐 Van</option><option value="caminhao">🚚 Caminhão (frete)</option>
          </select></label>
          <label>Modelo e cor<input name="carro" placeholder="Gol prata"></label>
          <label>Placa<input name="placa" placeholder="ABC1D23"></label>
        </div>
        <label class="inline"><input type="checkbox" name="ativo" checked> Ativo</label>
        <div class="linha"><button>Salvar</button><button type="button" class="sec" id="cancelarMotorista">Cancelar</button></div>
        <p class="erro" id="erroMotorista"></p>
      </form>
      <div id="pendentes"></div>
      <div id="listaMotoristas"></div>
    </section>

    <section id="aba-relatorio" hidden>
      <div class="linha">
        <h2>Relatório</h2>
        <label class="inline">De <input type="date" id="relDe"></label>
        <label class="inline">Até <input type="date" id="relAte"></label>
      </div>
      <div class="kpis" id="kpisRel"></div>
      <div id="tabelaRel"></div>
    </section>

    <section id="aba-config" hidden>
      <h2>Configurações</h2>
      <form id="formConfig" class="cartao">
        <div class="grade">
          <label>Nome da central<input name="nome"></label>
          <label>Cidade (ajuda a achar endereços)<input name="cidade" placeholder="Bonito, MS"></label>
          <label>WhatsApp do administrador (avisos)<input name="numero_admin" inputmode="tel"></label>
          <label>Comissão da central (%)<input name="comissao_pct" type="number" step="1" min="0" max="100"></label>
          <label>Segundos para o motorista aceitar<input name="oferta_segundos" type="number" min="15" max="300"></label>
          <label>Fator de rota (linha reta × fator)<input name="fator_rota" type="number" step="0.05" min="1" max="3"></label>
        </div>
        <label class="inline"><input type="checkbox" name="aceitando"> Central aberta (aceitando pedidos)</label>
        <label class="inline"><input type="checkbox" name="aprovar_automatico"> Aprovar sozinho o motorista que se cadastra pelo WhatsApp</label>

        <h3>Preços por veículo</h3>
        <p class="dica">Valor = taxa base + km × valor por km, nunca abaixo do mínimo. Desmarque um tipo para não oferecê-lo ao passageiro.</p>
        <div class="tabela"><table id="tabelaPrecos"></table></div>
        <button>Salvar</button>
        <p class="ok" id="okConfig"></p>
      </form>
    </section>
  </main>
</div>
<script src="painel.js"></script>
</body>
</html>
