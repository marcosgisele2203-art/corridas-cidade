<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Acompanhe sua corrida · Vai de Manu</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui,sans-serif;color:#193b37;background:#f3f7f6}header{background:#063e35;color:white;padding:18px;text-align:center;font-weight:800}main{max-width:760px;padding:14px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin:0 0 12px}#mapa{height:380px;border-radius:14px;background:#e4ebe9}small{color:#586d69}.mensagem{padding:12px;border-radius:10px;background:#e5f3ee}.veiculo{font-size:34px}.oculto{display:none!important}</style></head><body><header>🚗 Vai de Manu · Acompanhamento da corrida</header><main><section class="card"><h1>Sua viagem</h1><p class="mensagem" id="status" role="status">Verificando seu link de acompanhamento…</p><p id="veiculo"></p><p id="trajeto"></p><small>Localização aproximada, atualizada quando o GPS do motorista estiver disponível. Este link é temporário e funciona somente enquanto a viagem estiver ativa. Não compartilhe com outras pessoas.</small></section><section class="card" id="mapCard"><div id="mapa" aria-label="Mapa da posição recente do motorista"></div><p><small id="gps"></small></p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/mapa-fundo.js"></script><script src="/acompanhar.js"></script></body></html>
